<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - متجر شياكة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; min-height: 100vh; display: flex; align-items: center; padding: 20px 0; }
        .register-card { border: none; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; margin: auto; }
        .btn-primary { background-color: #0d6efd; border: none; border-radius: 10px; padding: 12px; font-weight: bold; }
        .form-control { border-radius: 10px; padding: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card register-card p-4">
        <div class="text-center mb-4">
            <h2 class="fw-bold">إنشاء حساب</h2>
            <p class="text-muted">انضم إلينا واحصل على أفضل العروض</p>
        </div>
        
        <form action="/register" method="POST">
            <div class="mb-3">
                <label class="form-label">الاسم الكامل</label>
                <input type="text" name="username" class="form-control" placeholder="بهاء محمد" required>
            </div>
            <div class="mb-3">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" name="email" class="form-control" placeholder="example@mail.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label">كلمة المرور</label>
                <input type="password" name="password" class="form-control" placeholder="********" required>
            </div>
            <div class="mb-3">
                <label class="form-label">تأكيد كلمة المرور</label>
                <input type="password" name="confirm_password" class="form-control" placeholder="********" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="terms" required>
                <label class="form-check-label small" for="terms">أوافق على شروط الاستخدام والخصوصية</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">إنشاء الحساب</button>
        </form>

        <div class="text-center mt-4">
            <span>لديك حساب بالفعل؟ <a href="login.html" class="text-decoration-none text-primary fw-bold">سجل دخولك</a></span>
        </div>
        <div class="text-center mt-2">
            <a href="index.html" class="text-muted text-decoration-none small">← العودة للرئيسية</a>
        </div>
    </div>
</div>

</body>
</html>
